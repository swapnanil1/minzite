---
name: Build installer ISO

on:
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Prepare environment
        run: |
          source image-template.env
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "$GITHUB_ENV"
          echo "DEFAULT_TAG=${DEFAULT_TAG}" >> "$GITHUB_ENV"
          echo "BIB_IMAGE=${BIB_IMAGE}" >> "$GITHUB_ENV"
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Login to GitHub Container Registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GHCR_TOKEN}" | sudo podman login ghcr.io --username "${GHCR_USER}" --password-stdin

      - name: Setup Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      - name: Validate signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          export COSIGN_PASSWORD="${COSIGN_PASSWORD:-}"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          diff -u cosign.pub "$RUNNER_TEMP/cosign.pub"

      - name: Verify and pin source image
        id: source
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY}/${IMAGE_NAME}"
          cosign verify --key cosign.pub "${image}:${DEFAULT_TAG}" > "$RUNNER_TEMP/verified-image.json"
          digest=$(jq -er '.[0].critical.image["docker-manifest-digest"] | select(test("^sha256:[a-f0-9]{64}$"))' "$RUNNER_TEMP/verified-image.json")
          echo "image=${image}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Build installer ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso-kde.toml
          image: ${{ steps.source.outputs.image }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          additional-args: --use-librepo=True --rootfs=ext4

      - name: Sign and verify installer ISO
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ""
          OUTPUT_DIR: ${{ steps.build.outputs.output-directory }}
        run: |
          set -euo pipefail
          export COSIGN_PASSWORD="${COSIGN_PASSWORD:-}"
          mapfile -d '' isos < <(find "$OUTPUT_DIR" -type f -name '*.iso' -print0)
          [[ ${#isos[@]} -eq 1 ]] || { echo 'Expected exactly one installer ISO' >&2; exit 1; }
          mv -- "${isos[0]}" "$OUTPUT_DIR/minzite-deck-amd64.iso"
          cd "$OUTPUT_DIR"
          sha256sum minzite-deck-amd64.iso > SHA256SUMS
          cosign sign-blob --yes --key env://COSIGN_PRIVATE_KEY \
            --output-signature minzite-deck-amd64.iso.sig minzite-deck-amd64.iso
          cosign verify-blob --key "$GITHUB_WORKSPACE/cosign.pub" \
            --signature minzite-deck-amd64.iso.sig minzite-deck-amd64.iso
          cp "$GITHUB_WORKSPACE/cosign.pub" .

      - name: Upload signed installer ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minzite-deck-iso-amd64
          path: |
            ${{ steps.build.outputs.output-directory }}/*.iso
            ${{ steps.build.outputs.output-directory }}/*.sig
            ${{ steps.build.outputs.output-directory }}/SHA256SUMS
            ${{ steps.build.outputs.output-directory }}/cosign.pub
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true
